version: '3.8'

services:
  # FastAPI Backend (Competition Mode)
  api:
    build: .
    container_name: vifinqa-api
    command: uvicorn src.competition_api:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    restart: unless-stopped
    networks:
      - ai-network

  # Next.js Frontend
  frontend:
    build: 
      context: ./frontend
    container_name: vifinqa-frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - ai-network

  # ARCHIVED SERVICES (Bỏ comment nếu sau này cần dùng)
  #
  # postgres:
  #   image: postgres:15
  #   ...
  #
  # qdrant:
  #   image: qdrant/qdrant:latest
  #   ...
  #
  # redis:
  #   image: redis:7-alpine
  #   ...
  #
  # minio:
  #   image: minio/minio:latest
  #   ...

networks:
  ai-network:
    driver: bridge
