# ================================================================================
# CẤU HÌNH INFERENCE HYBRID (API + LOCAL OLLAMA) - TUÂN THỦ < 15B
# Planner & Programmer: Gọi OpenRouter API (Qwen 14B) siêu nhanh ~1s
# Retriever & Critic: Chạy Local Ollama (Qwen 3B) siêu nhẹ ~2GB VRAM
# ================================================================================

run_mode: full
input_root: ViFinQA/financial_statements
output_root: artifacts/preprocessing
full_run_confirmed: true
resume: true
inference_limit_questions: 20

# ════════════════════════════════════════════════════════════════
# 1. PLANNER: GỌI OPENROUTER API (Qwen 14B - Tốc độ ~1.3s)
# ════════════════════════════════════════════════════════════════
llm_planner:
  engine: "openai"
  base_url: "https://openrouter.ai/api/v1"
  api_key: "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"
  model_name: "qwen/qwen3-14b"
  temperature: 0.0

# ════════════════════════════════════════════════════════════════
# 2. RETRIEVER: CHẠY OLLAMA LOCAL (Qwen 3B)
# ════════════════════════════════════════════════════════════════
llm_retriever:
  engine: "ollama"
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model_name: "qwen2.5-coder:3b"
  temperature: 0.0

# ════════════════════════════════════════════════════════════════
# 3. PROGRAMMER: GỌI OPENROUTER API (Qwen 14B - Tốc độ ~1.3s)
# ════════════════════════════════════════════════════════════════
llm_programmer:
  engine: "openai"
  base_url: "https://openrouter.ai/api/v1"
  api_key: "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"
  model_name: "qwen/qwen3-14b"
  temperature: 0.0

# ════════════════════════════════════════════════════════════════
# 4. CRITIC: CHẠY OLLAMA LOCAL (Qwen 3B)
# ════════════════════════════════════════════════════════════════
llm_critic:
  engine: "ollama"
  base_url: "http://localhost:11434/v1"
  api_key: "ollama"
  model_name: "qwen2.5-coder:3b"
  temperature: 0.0

embedding:
  # Chuyển từ BAAI/bge-m3 (Mô hình cực nặng 567M params) 
  # Sang MiniLM (Chỉ 117M params) - Chạy trên CPU nhanh gấp 5-10 lần mà vẫn hỗ trợ tiếng Việt tốt.
  model_name: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
  batch_size: 32

reranker:
  model_name: "BAAI/bge-reranker-v2-m3"